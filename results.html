<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Pinups — Results</title>
<link rel="stylesheet" href="assets/css/style.css?v=1" />
<link rel="icon" href="assets/img/favicon-32.png" sizes="32x32" />
<link rel="icon" href="assets/img/favicon-192.png" sizes="192x192" />
<link rel="apple-touch-icon" href="assets/img/favicon-180.png" />
<link rel="shortcut icon" href="assets/img/favicon.ico" />
</head>
<body>

<header class="site-header">
  <div class="header-row">
    <img src="assets/img/logo.png" alt="The Rock Pub & Kitchen" class="site-logo" />
    <p class="brand">Pinups<span class="dot">.</span></p>
  </div>
  <p class="subtitle">Results</p>
</header>

<main id="results-main"></main>

<nav class="tab-nav">
  <a href="index.html"><span class="icon">&#128197;</span>Fixtures</a>
  <a href="results.html" class="active"><span class="icon">&#127942;</span>Results</a>
  <a href="players.html"><span class="icon">&#128101;</span>Players</a>
  <a href="rules.html"><span class="icon">&#128220;</span>Rules</a>
</nav>

<script src="assets/js/players-data.js?v=1"></script>
<script src="assets/js/results-data.js?v=2"></script>
<script>
  const MONTH_SHORT = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  const main = document.getElementById("results-main");

  const fmtAvg = (total, games) => {
    if (!games) return "&ndash;";
    const r = Math.round((total / games) * 10) / 10;
    return Number.isInteger(r) ? String(r) : r.toFixed(1);
  };

  // Season Stats — always shown, seeded from the full squad so everyone
  // appears even before they've played a match.
  const seasonStats = {};
  PINUPS_PLAYERS.forEach(({ name }) => {
    seasonStats[name] = { games: 0, totalScore: 0, topScorer: 0, sotw: 0, bolters: 0, squares: 0 };
  });
  const ensure = (name) => {
    if (!seasonStats[name]) seasonStats[name] = { games: 0, totalScore: 0, topScorer: 0, sotw: 0, bolters: 0, squares: 0 };
    return seasonStats[name];
  };
  PINUPS_RESULTS.forEach((m) => {
    const maxScore = Math.max(...m.players.map((p) => p.score));
    m.players.forEach((p) => {
      const stat = ensure(p.name);
      stat.games += 1;
      stat.totalScore += p.score;
      stat.bolters += p.bolters;
      stat.squares += p.squares;
      if (p.score === maxScore) stat.topScorer += 1;
    });
    if (m.skittleOfTheWeek) ensure(m.skittleOfTheWeek).sotw += 1;
  });
  Object.entries(typeof PINUPS_EXTRA_SOTW !== "undefined" ? PINUPS_EXTRA_SOTW : {}).forEach(([name, count]) => {
    ensure(name).sotw += count;
  });

  const statsCard = document.createElement("div");
  statsCard.className = "card";
  statsCard.innerHTML = `
    <h2 class="section-title">Season Stats</h2>
    <div class="result-table-wrap">
      <table class="result-table">
        <thead>
          <tr><th>Player</th><th>Games</th><th>Average</th><th>Bolters</th><th>Squares</th><th>Top Scorer</th><th>Skittle of the Week</th></tr>
        </thead>
        <tbody>
          ${Object.entries(seasonStats)
            .sort((a, b) => {
              const avgA = a[1].games ? a[1].totalScore / a[1].games : -Infinity;
              const avgB = b[1].games ? b[1].totalScore / b[1].games : -Infinity;
              return avgB - avgA || a[0].localeCompare(b[0]);
            })
            .map(([name, s]) => `
              <tr>
                <td>${name}</td>
                <td>${s.games}</td>
                <td>${fmtAvg(s.totalScore, s.games)}</td>
                <td>${s.bolters}</td>
                <td>${s.squares}</td>
                <td>${s.topScorer}</td>
                <td>${s.sotw}</td>
              </tr>
            `).join("")}
        </tbody>
      </table>
    </div>
  `;
  main.appendChild(statsCard);

  // Single-stat leaderboards — top 3 by bolters, squares, and top-scorer count.
  // Ties for 3rd place are all included (joint placings), so the list can run longer than 3 rows.
  const leaderboard = (title, key) => {
    const sorted = Object.entries(seasonStats)
      .filter(([, s]) => s.games > 0 && s[key] > 0)
      .sort((a, b) => b[1][key] - a[1][key] || a[0].localeCompare(b[0]));
    const cutoff = sorted.length ? sorted[Math.min(2, sorted.length - 1)][1][key] : null;
    const rows = sorted.filter(([, s]) => s[key] >= cutoff);
    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML = `
      <h2 class="section-title">${title}</h2>
      <div class="result-table-wrap">
        <table class="result-table">
          <thead>
            <tr><th>Player</th><th>${title}</th></tr>
          </thead>
          <tbody>
            ${rows.map(([name, s]) => `
              <tr>
                <td>${name}</td>
                <td>${s[key]}</td>
              </tr>
            `).join("")}
          </tbody>
        </table>
      </div>
    `;
    main.appendChild(card);
  };
  if (PINUPS_RESULTS.length) {
    leaderboard("Top Bolters", "bolters");
    leaderboard("Top Squares", "squares");
    leaderboard("Top Scorers", "topScorer");
  }

  if (!PINUPS_RESULTS.length) {
    main.innerHTML += `
      <div class="card">
        <div class="empty-state">
          <div class="emoji">&#127881;</div>
          <p><strong>No results yet.</strong></p>
          <p>Check back once the season kicks off — results will be posted here after every match.</p>
        </div>
      </div>
    `;
  } else {
    PINUPS_RESULTS.slice().reverse().forEach((m) => {
      const d = new Date(m.date + "T00:00:00");
      const dateStr = `${["Sun","Mon","Tue","Wed","Thu","Fri","Sat"][d.getDay()]} ${d.getDate()} ${MONTH_SHORT[d.getMonth()]} ${d.getFullYear()}`;
      const won = m.pinupsScore > m.opponentScore;
      const drew = m.pinupsScore === m.opponentScore;
      const diff = Math.abs(m.pinupsScore - m.opponentScore);
      const resultLabel = won ? `WON +${diff}` : drew ? "DREW" : `LOST -${diff}`;
      const resultClass = won ? "win" : drew ? "draw" : "loss";

      const card = document.createElement("div");
      card.className = "card";
      card.innerHTML = `
        <div class="result-meta">${dateStr} &middot; ${m.venue} &middot; ${m.homeAway}</div>
        <div class="result-score-row">
          <div class="result-team">
            <span class="result-team-name">Pinups</span>
            <span class="result-team-score">${m.pinupsScore}</span>
          </div>
          <span class="result-badge ${resultClass}">${resultLabel}</span>
          <div class="result-team">
            <span class="result-team-score">${m.opponentScore}</span>
            <span class="result-team-name">${m.opponent}</span>
          </div>
        </div>
        <div class="result-table-wrap">
          <table class="result-table">
            <thead>
              <tr><th>Player</th><th>Score</th><th>Bolters</th><th>Squares</th></tr>
            </thead>
            <tbody>
              ${m.players.map((p) => `
                <tr>
                  <td>${p.name}</td>
                  <td>${p.score}</td>
                  <td>${p.bolters}</td>
                  <td>${p.squares}</td>
                </tr>
              `).join("")}
            </tbody>
          </table>
        </div>
      `;
      main.appendChild(card);
    });
  }
</script>

</body>
</html>
