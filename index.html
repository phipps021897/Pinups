<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Pinups — Fixtures</title>
<link rel="stylesheet" href="assets/css/style.css" />
<link rel="icon" href="assets/img/favicon-32.png" sizes="32x32" />
<link rel="icon" href="assets/img/favicon-192.png" sizes="192x192" />
<link rel="apple-touch-icon" href="assets/img/favicon-180.png" />
<link rel="shortcut icon" href="assets/img/favicon.ico" />
</head>
<body>

<header class="site-header">
  <div class="header-row">
    <img src="assets/img/logo.png" alt="The Rock Pub & Kitchen" class="site-logo" />
    <p class="brand">Pinups<span class="dot">.</span></p>
  </div>
  <p class="subtitle">Div 2 Fixtures 2026&ndash;27</p>
</header>

<main>
  <div class="card">
    <h2 class="section-title">Fixtures Calendar</h2>
    <div class="cal-nav">
      <button id="cal-prev" aria-label="Previous month">&#8249;</button>
      <div id="cal-month-label" class="cal-month-label">Month Year</div>
      <button id="cal-next" aria-label="Next month">&#8250;</button>
    </div>
    <button id="cal-today" class="cal-today-btn">Today</button>
    <div id="cal-grid" class="cal-grid"></div>
    <div class="legend">
      <span class="legend-item"><span class="dot home"></span> Home</span>
      <span class="legend-item"><span class="dot away"></span> Away</span>
      <span class="legend-item"><span class="dot cup"></span> Cup</span>
      <span class="legend-item"><span class="dot pairs"></span> Pairs</span>
      <span class="legend-item"><span class="dot bye"></span> Bye</span>
    </div>
  </div>

  <div class="card">
    <h2 class="section-title">This Month</h2>
    <div id="cal-agenda"></div>
  </div>
</main>

<nav class="tab-nav">
  <a href="index.html" class="active"><span class="icon">&#128197;</span>Fixtures</a>
  <a href="results.html"><span class="icon">&#127942;</span>Results</a>
  <a href="players.html"><span class="icon">&#128101;</span>Players</a>
  <a href="rules.html"><span class="icon">&#128220;</span>Rules</a>
</nav>

<script src="assets/js/fixtures-data.js"></script>
<script src="assets/js/calendar.js"></script>
</body>
</html>
